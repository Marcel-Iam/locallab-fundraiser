<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fundraiser Live</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap');

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg:      #0c0c0c;
  --surface: #161616;
  --border:  #282828;
  --yellow:  #FFD166;
  --white:   #f0f0f0;
  --muted:   #424242;
  --muted2:  #6a6a6a;
  --green:   #3ddc84;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
}

/* ── LAYOUT: left panel | center thermometer | right panel */
.stage {
  width: 100vw;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 340px 1fr;
  grid-template-rows: 1fr 96px;
}

/* ─── LEFT ─── */
.left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px 48px 48px 64px;
  border-right: 1px solid var(--border);
}

  .event-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: flex-start;
}

.editable-title {
  max-width: 100%;
  min-width: 220px;
  min-height: 1.1em;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.8rem, 5vw, 5rem);
  line-height: 0.95;
  letter-spacing: 0.04em;
  color: var(--white);
  outline: none;
  cursor: text;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
}

.editable-title:hover {
  border-bottom-color: rgba(255, 209, 102, 0.35);
}

.editable-title:focus {
  color: var(--yellow);
  border-bottom-color: var(--yellow);
}

.editable-title:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
}
.event-label {
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 12px;
}

.event-label::before {
  content: '';
  display: block;
  width: 22px;
  height: 1px;
  background: var(--yellow);
  flex-shrink: 0;
}

.donation-stack {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.donation-section-label {
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

.history-feed {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.history-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  opacity: 0;
  animation: fadeUp 0.4s ease-out forwards;
  animation-fill-mode: forwards;
}

.history-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: var(--final-opacity, 0.55);
    transform: translateY(0);
  }
}

.history-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.55rem;
  letter-spacing: 0.04em;
  color: var(--muted2);
  line-height: 1;
}

.history-amt {
  font-size: 1rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.history-time {
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.03em;
  margin-top: 2px;
}

.latest-block {
  border-left: 2px solid var(--yellow);
  padding-left: 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.latest-block.flash {
  animation: lflash 4.5s ease-out;
}

@keyframes lflash {
  0%, 10% {
    border-color: var(--white);
  }
  100% {
    border-color: var(--yellow);
  }
}

.latest-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 4vw, 3.2rem);
  letter-spacing: 0.04em;
  color: var(--white);
  line-height: 1;
}

.latest-amt {
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--yellow);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

.latest-time {
  font-size: 0.85rem;
  font-weight: 400;
  color: var(--muted2);
  letter-spacing: 0.03em;
  margin-top: 4px;
}

/* ─── CENTER ─── */
.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 0;
}

.thermo-header {
  text-align: center;
  margin-bottom: 10px;
}

.total-label {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 4px;
}

.total-amount {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(5rem, 10vw, 8rem);
  letter-spacing: 0.02em;
  line-height: 0.9;
  color: var(--white);
}

.total-amount.bump {
  animation: bump 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes bump {
  0% {
    color: var(--white);
    transform: scale(1);
  }
  28% {
    color: var(--yellow);
    transform: scale(1.04);
  }
  100% {
    color: var(--white);
    transform: scale(1);
  }
}

.goal-line {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--muted2);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

.goal-line strong {
  color: var(--yellow);
  font-weight: 700;
}

.thermo-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  letter-spacing: 0.04em;
  color: var(--yellow);
  line-height: 1;
  text-align: center;
  margin-bottom: 14px;
}

.thermo-pct.pop {
  animation: pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes pop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

/* ── THERMOMETER ASSEMBLY */
.thermo-assembly {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  width: 100%;
  justify-content: center;
  height: min(900px, 75vh);
}

.ticks-left,
.ticks-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-bottom: 70px;
  height: 100%;
}

.ticks-left {
  align-items: flex-end;
}

.ticks-right {
  align-items: flex-start;
}

.tick {
  font-size: 0.6rem;
  font-weight: 500;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: color 0.5s;
  letter-spacing: 0.05em;
}

.ticks-left .tick::after {
  content: '';
  display: block;
  width: 8px;
  height: 1px;
  background: var(--muted);
  transition: background 0.5s;
}

.ticks-right .tick::before {
  content: '';
  display: block;
  width: 8px;
  height: 1px;
  background: var(--muted);
  transition: background 0.5s;
}

.tick.lit {
  color: var(--yellow);
}

.ticks-left .tick.lit::after {
  background: var(--yellow);
}

.ticks-right .tick.lit::before {
  background: var(--yellow);
}

.thermo-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  position: relative;
}

.thermo-tube-outer {
  width: 90px;
  flex: 1;
  border-radius: 45px 45px 0 0;
  background: #1a1a1a;
  border: 2px solid #333;
  border-bottom: none;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.thermo-tube-inner {
  position: absolute;
  inset: 8px 22px 0;
  background: #0e0e0e;
  border-radius: 14px 14px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.thermo-mercury {
  width: 100%;
  height: 0%;
  background: linear-gradient(
    180deg,
    #ffe8a0 0%,
    var(--yellow) 30%,
    #c8920a 100%
  );
  transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.thermo-mercury::after {
  content: '';
  position: absolute;
  top: 0;
  left: 3px;
  right: 3px;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent);
  border-radius: 3px;
}

.thermo-tube-outer::after {
  content: '';
  position: absolute;
  top: 10px;
  left: 9px;
  width: 8px;
  bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 60%);
  border-radius: 3px;
  pointer-events: none;
}

.thermo-tube-outer::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    180deg,
    transparent,
    transparent calc(25% - 1px),
    rgba(255,255,255,0.04) calc(25% - 1px),
    rgba(255,255,255,0.04) 25%
  );
  z-index: 3;
  pointer-events: none;
}

.thermo-bulb-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.thermo-bulb-outer {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #1a1a1a;
  border: 2px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.thermo-bulb-inner {
  width: 86px;
  height: 86px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 36% 36%,
    #ffe8a0 0%,
    var(--yellow) 45%,
    #b07808 100%
  );
  position: relative;
}

.thermo-bulb-inner::after {
  content: '';
  position: absolute;
  top: 14px;
  left: 18px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.28);
}

/* ─── RIGHT ─── */
.right {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px 64px 48px 48px;
  border-left: 1px solid var(--border);
}

.qr-donate-panel {
  width: min(360px, 100%);
  margin: 0 auto;
  padding: 28px;
  border: 1px solid var(--border);
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.035),
    rgba(255,255,255,0.01)
  );
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.qr-icon {
  width: 44px;
  height: 44px;
  margin-bottom: 14px;
  color: var(--yellow);
}

.qr-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--yellow);
  margin-bottom: 8px;
}

.qr-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.6rem, 4vw, 4rem);
  letter-spacing: 0.06em;
  color: var(--white);
  line-height: 0.95;
  margin-bottom: 18px;
}

.qr-box {
  width: 240px;
  height: 240px;
  padding: 12px;
  background: #ffffff;
  border-radius: 8px;
  margin-bottom: 16px;
}

.qr-box img {
  width: 100%;
  height: 100%;
  display: block;
}

.qr-handle {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--muted2);
  letter-spacing: 0.04em;
}

.qr-subtext {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 8px;
}

/* ─── BOTTOM BAR ─── */
.bottom-bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 64px;
  border-top: 1px solid var(--border);
  min-height: 96px;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  animation: dotpulse 2.4s ease-in-out infinite;
}

@keyframes dotpulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}

.dot.error {
  background: #e05252;
  animation: dotblink 1s ease-in-out infinite;
}

@keyframes dotblink {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.1;
  }
}

.status-text {
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--muted2);
  letter-spacing: 0.06em;
}

.bottom-right-group {
  display: flex;
  align-items: center;
  gap: 22px;
}

.instagram-mini {
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0.9;
}

.instagram-mini-icon {
  width: 34px;
  height: 34px;
  color: var(--white);
  flex-shrink: 0;
}

.instagram-mini-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.instagram-mini-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--yellow);
  line-height: 1;
}

.instagram-mini-handle {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--white);
  letter-spacing: 0.04em;
  line-height: 1.15;
}

.instagram-mini-qr {
  width: 78px;
  height: 78px;
  padding: 5px;
  background: #ffffff;
  border-radius: 6px;
  flex-shrink: 0;
}

.instagram-mini-qr img {
  width: 100%;
  height: 100%;
  display: block;
}

.logo-wrap {
  opacity: 0.4;
  display: flex;
  align-items: center;
  transition: opacity 0.3s;
}

.logo-wrap:hover {
  opacity: 0.85;
}

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.12em;
  color: var(--white);
  white-space: nowrap;
}

/* ─── MILESTONE BANNER ─── */
.milestone-banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: var(--yellow);
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 4vw, 3rem);
  letter-spacing: 0.1em;
  color: #0c0c0c;
  transform: translateY(-100%);
  transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
  pointer-events: none;
}

.milestone-banner.show {
  transform: translateY(0);
}

.screen-flash {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  background: rgba(255,209,102,0.05);
}

.screen-flash.active {
  animation: flashOut 1s ease-out forwards;
}

@keyframes flashOut {
  0% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

#confetti-canvas {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
}

/* ─── SMALL SCREEN SAFETY ─── */
@media (max-width: 1200px) {
  .stage {
    grid-template-columns: 1fr 300px 1fr;
  }

  .left {
    padding-left: 38px;
    padding-right: 34px;
  }

  .right {
    padding-left: 34px;
    padding-right: 38px;
  }

  .qr-box {
    width: 210px;
    height: 210px;
  }
}
</style>
</head>

<body>

<div class="screen-flash" id="screen-flash"></div>
<canvas id="confetti-canvas"></canvas>
<div class="milestone-banner" id="milestone-banner"></div>

<div class="stage">

  <!-- LEFT: event label top, donation stack bottom -->
  <div class="left">
    <div class="event-title-wrap">
  <div class="event-label">Live Fundraiser</div>

  <div
    class="editable-title"
    id="editable-title"
    contenteditable="true"
    spellcheck="false"
    data-placeholder="Click to add title"
  >
    Fundraiser
  </div>
</div>

    <div class="donation-stack">
      <div class="donation-section-label">Donations</div>
      <div class="history-feed" id="history-feed"></div>

      <div class="latest-block" id="latest-block">
        <div class="latest-name" id="latest-name">Waiting for first donation...</div>
        <div class="latest-amt" id="latest-amt"></div>
        <div class="latest-time" id="latest-time"></div>
      </div>
    </div>
  </div>

  <!-- CENTER: total + thermometer -->
  <div class="center">
    <div class="thermo-header">
      <div class="total-label">Total Raised</div>
      <div class="total-amount" id="total-amount">$0</div>
      <div class="goal-line">Goal: <strong id="goal-display">$1,000</strong></div>
    </div>

    <div class="thermo-pct" id="thermo-pct">0%</div>

    <div class="thermo-assembly">
      <div class="ticks-left">
        <div class="tick" data-pct="100">100%</div>
        <div class="tick" data-pct="75">75%</div>
        <div class="tick" data-pct="50">50%</div>
        <div class="tick" data-pct="25">25%</div>
        <div class="tick" data-pct="0">0%</div>
      </div>

      <div class="thermo-body">
        <div class="thermo-tube-outer">
          <div class="thermo-tube-inner">
            <div class="thermo-mercury" id="thermo-mercury"></div>
          </div>
        </div>

        <div class="thermo-bulb-wrap">
          <div class="thermo-bulb-outer">
            <div class="thermo-bulb-inner"></div>
          </div>
        </div>
      </div>

      <div class="ticks-right">
        <div class="tick" data-goal="1000">$1,000</div>
        <div class="tick" data-goal="750">$750</div>
        <div class="tick" data-goal="500">$500</div>
        <div class="tick" data-goal="250">$250</div>
        <div class="tick" data-goal="0">$0</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Venmo donation QR -->
  <div class="right">
    <div class="qr-donate-panel">

      <svg class="qr-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="currentColor" d="M444.17,32H70.28C49.85,32,32,46.7,32,66.89V441.6C32,461.91,49.85,480,70.28,480H444.06C464.6,480,480,461.8,480,441.61V66.89C480.12,46.7,464.6,32,444.17,32ZM278,387H174.32L132.75,138.44l90.75-8.62,22,176.87c20.53-33.45,45.88-86,45.88-121.87,0-19.62-3.36-33-8.61-44L365.4,124.1c9.56,15.78,13.86,32,13.86,52.57C379.25,242.17,323.34,327.26,278,387Z"/>
      </svg>

      <div class="qr-label">Venmo</div>
      <div class="qr-title">Scan to Donate</div>

      <div class="qr-box">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=https%3A%2F%2Fvenmo.com%2Fu%2Fkevinaoussou"
          alt="QR code for Venmo donation link"
        />
      </div>

      <div class="qr-handle">@kevinaoussou</div>
      <div class="qr-subtext">Every gift moves the goal</div>

    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Connecting...</span>
    </div>

    <div class="bottom-right-group">

      <div class="instagram-mini">
        <svg class="instagram-mini-icon" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path

<script>
const SPREADSHEET_ID = '1SG5EtxD7SgBpZCMykN0zFd0hbOBYdy3lkAzcgkybw4I';
const SHEET_NAME     = 'Fundraiser Integration Tab (DONOTEDITTITLE)';
const GOAL           = 1000;
const POLL_MS        = 4000;

const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
const MILESTONES = [25, 50, 75, 100];

let prevTotal = null;
let prevDonorCount = -1;
let errorCount = 0;
let rafHandle = null;
let milestonesSeen = new Set();

const el = id => document.getElementById(id);

function fmt(n, dec = 0) {
  if (!isFinite(n)) return '$0';

  return '$' + Number(n).toLocaleString('en-US', {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec
  });
}

function fmtTime(value) {
  if (!value) return '';

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) return '';

  return d.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit'
  });
}

function cleanText(value) {
  return String(value ?? '').trim();
}

function parseAmount(value) {
  if (typeof value === 'number') return value;

  const cleaned = String(value ?? '')
    .replace(/[$,\s]/g, '')
    .trim();

  const n = Number(cleaned);

  return Number.isFinite(n) ? n : 0;
}

function countUp(from, to, ms, onTick, onDone) {
  if (rafHandle) cancelAnimationFrame(rafHandle);

  const start = performance.now();

  function step(now) {
    const t = Math.min((now - start) / ms, 1);
    const e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

    onTick(from + (to - from) * e);

    if (t < 1) {
      rafHandle = requestAnimationFrame(step);
    } else {
      onTick(to);
      if (onDone) onDone();
    }
  }

  rafHandle = requestAnimationFrame(step);
}

function setStatus(text, isError = false) {
  el('status-text').textContent = text;
  el('status-dot').classList.toggle('error', isError);
}

function parseGviz(text) {
  const json = JSON.parse(
    text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1)
  );

  const rows = json.table?.rows || [];

  return rows
    .map(row => {
      const cells = row.c || [];

      const timestamp = cells[0]?.v ?? '';
      const donor = cleanText(cells[1]?.v ?? '');
      const amount = parseAmount(cells[2]?.v ?? '');

      return {
        timestamp,
        donor: donor || 'Anonymous',
        amount
      };
    })
    .filter(d => d.amount > 0);
}

function updateTicks(total, pct) {
  document.querySelectorAll('.ticks-left .tick').forEach(tick => {
    const value = Number(tick.dataset.pct);
    tick.classList.toggle('lit', pct >= value);
  });

  document.querySelectorAll('.ticks-right .tick').forEach(tick => {
    const value = Number(tick.dataset.goal);
    tick.classList.toggle('lit', total >= value);
  });
}

function updateHistory(donations) {
  const feed = el('history-feed');
  feed.innerHTML = '';

  const previous = donations.slice(0, -1).reverse().slice(0, 5);

  previous.forEach((donation, index) => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.style.setProperty('--final-opacity', Math.max(0.25, 0.62 - index * 0.08));

    item.innerHTML = `
      <div class="history-row">
        <div class="history-name">${escapeHtml(donation.donor)}</div>
        <div class="history-amt">${fmt(donation.amount)}</div>
      </div>
      <div class="history-time">${fmtTime(donation.timestamp)}</div>
    `;

    feed.appendChild(item);
  });
}

function updateLatest(donations, changed) {
  const latest = donations[donations.length - 1];

  if (!latest) {
    el('latest-name').textContent = 'Waiting for first donation...';
    el('latest-amt').textContent = '';
    el('latest-time').textContent = '';
    return;
  }

  el('latest-name').textContent = latest.donor;
  el('latest-amt').textContent = fmt(latest.amount);
  el('latest-time').textContent = fmtTime(latest.timestamp);

  if (changed) {
    const block = el('latest-block');
    block.classList.remove('flash');
    void block.offsetWidth;
    block.classList.add('flash');
  }
}

function updateDisplay(donations) {
  donations = Array.isArray(donations) ? donations : [];

  const total = donations.reduce((sum, d) => sum + d.amount, 0);
  const pct = GOAL > 0 ? Math.min((total / GOAL) * 100, 100) : 0;

  const totalChanged = prevTotal !== null && total !== prevTotal;
  const donorCountChanged = prevDonorCount !== -1 && donations.length > prevDonorCount;

  el('goal-display').textContent = fmt(GOAL);
  el('thermo-mercury').style.height = `${pct}%`;
  el('thermo-pct').textContent = `${Math.round(pct)}%`;

  updateTicks(total, pct);
  updateHistory(donations);
  updateLatest(donations, donorCountChanged);

  if (prevTotal === null) {
    el('total-amount').textContent = fmt(total);
  } else if (totalChanged) {
    countUp(prevTotal, total, 900, value => {
      el('total-amount').textContent = fmt(value);
    });

    bump(el('total-amount'));
    bump(el('thermo-pct'));
    flashScreen();
  } else {
    el('total-amount').textContent = fmt(total);
  }

  if (donations.length === 0) {
    el('history-feed').innerHTML = '';
    el('latest-name').textContent = 'Waiting for first donation...';
    el('latest-amt').textContent = '';
    el('latest-time').textContent = '';

    // Reset milestones too, so the display can be reused cleanly.
    milestonesSeen.clear();
  } else {
    checkMilestones(pct);
  }

  prevTotal = total;
  prevDonorCount = donations.length;
}

function bump(node) {
  node.classList.remove('bump', 'pop');
  void node.offsetWidth;

  if (node.id === 'thermo-pct') {
    node.classList.add('pop');
  } else {
    node.classList.add('bump');
  }
}

function flashScreen() {
  const flash = el('screen-flash');
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');
}

function checkMilestones(pct) {
  for (const milestone of MILESTONES) {
    if (pct >= milestone && !milestonesSeen.has(milestone)) {
      milestonesSeen.add(milestone);
      showMilestone(milestone);
      launchConfetti(milestone >= 100 ? 220 : 120);
    }
  }
}

function showMilestone(milestone) {
  const banner = el('milestone-banner');

  banner.textContent = milestone >= 100
    ? 'Goal Reached!'
    : `${milestone}% Milestone Reached`;

  banner.classList.add('show');

  setTimeout(() => {
    banner.classList.remove('show');
  }, 3600);
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

/* ─── CONFETTI ─── */
let particles = [];
let confettiRunning = false;

function launchConfetti(n) {
  const cv = el('confetti-canvas');
  const ctx = cv.getContext('2d');

  cv.width = innerWidth;
  cv.height = innerHeight;

  const cols = ['#FFD166', '#ffffff', '#c8920a', '#ffe699', '#e8e8e8'];

  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * cv.width,
      y: -20 - Math.random() * cv.height * 0.25,
      w: 5 + Math.random() * 8,
      h: 8 + Math.random() * 12,
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 5,
      rot: Math.random() * Math.PI,
      vr: -0.18 + Math.random() * 0.36,
      color: cols[Math.floor(Math.random() * cols.length)],
      life: 160 + Math.random() * 80
    });
  }

  if (!confettiRunning) {
    confettiRunning = true;
    requestAnimationFrame(drawConfetti);
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, cv.width, cv.height);

    particles = particles.filter(p => p.life > 0 && p.y < cv.height + 40);

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.035;
      p.rot += p.vr;
      p.life -= 1;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    if (particles.length) {
      requestAnimationFrame(drawConfetti);
    } else {
      confettiRunning = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
    }
  }
}

/* ─── DATA POLLING ─── */
async function fetchDonations() {
  try {
    const freshUrl =
      `${GVIZ_URL}` +
      `&tq=${encodeURIComponent('select *')}` +
      `&cacheBust=${Date.now()}`;

    const res = await fetch(freshUrl, {
      method: 'GET',
      cache: 'reload',
      headers: {
        'Cache-Control': 'no-cache',
        'Pragma': 'no-cache'
      }
    });

    if (!res.ok) {
      throw new Error(`Google Sheet request failed: ${res.status}`);
    }

    const text = await res.text();

    let donations = [];

    try {
      donations = parseGviz(text);
    } catch (parseErr) {
      console.error('GViz parse failed:', parseErr);

      // If Google returns an empty/weird response after the sheet is cleared,
      // reset the display instead of leaving the previous total on screen.
      donations = [];
    }

    updateDisplay(donations);

    errorCount = 0;

    setStatus(`Live • Updated ${new Date().toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: '2-digit'
    })}`);
  } catch (err) {
    console.error(err);

    errorCount += 1;

    setStatus(
      errorCount > 2 ? 'Connection issue' : 'Reconnecting...',
      true
    );
  }
}

window.addEventListener('resize', () => {
  const cv = el('confetti-canvas');
  cv.width = innerWidth;
  cv.height = innerHeight;
});

  const editableTitle = el('editable-title');

const savedTitle = localStorage.getItem('fundraiserDisplayTitle');

if (savedTitle !== null) {
  editableTitle.textContent = savedTitle;
}

editableTitle.addEventListener('input', () => {
  localStorage.setItem('fundraiserDisplayTitle', editableTitle.textContent.trim());
});

editableTitle.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    editableTitle.blur();
  }
});
fetchDonations();
setInterval(fetchDonations, POLL_MS);
</script>
